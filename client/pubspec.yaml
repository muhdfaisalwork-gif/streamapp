name: streaming_app
description: "Cross-Platform Legal Streaming App - Android, TV, Desktop & Tablet"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking
  http: ^1.2.0

  # Image loading + caching
  cached_network_image: ^3.3.0

  # Persistent local storage
  shared_preferences: ^2.2.0

  # Native video player (HLS + MP4) on Android, Windows, Linux
  media_kit: ^1.1.0
  media_kit_video: ^1.0.0
  media_kit_libs_android_video: ^1.0.0
  media_kit_libs_windows_video: ^1.0.0
  media_kit_libs_linux: ^1.0.0

  # WebView for embed-based players (iOS + TV fallback)
  webview_flutter: ^4.4.0

  # Custom title bar + window management on desktop
  window_manager: ^0.3.0

  # State management
  provider: ^6.1.0

  # URL launcher (open external links, trailers)
  url_launcher: ^6.2.0

  # Path utilities
  path_provider: ^2.1.0

  # HTML rendering (for legal disclaimers etc)
  flutter_html: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
