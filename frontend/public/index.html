<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, viewport-fit=cover" />
    <title>ShadowStream - Free Movies & TV Shows</title>
    <meta name="description" content="ShadowStream - Stream thousands of movies and TV shows ad-free across all your devices." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="ShadowStream" />

    <!-- iOS home-screen support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ShadowStream" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <style id="expo-reset">
      html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        background-color: #0d0d0d;
        -webkit-text-size-adjust: 100%;
      }
      #root {
        display: flex;
        height: 100%;
        width: 100%;
        min-height: 100%;
        min-width: 100%;
        flex: 1;
        flex-direction: column;
      }
    </style>
    <link rel="icon" href="/favicon.ico"/>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run ShadowStream.</noscript>
    <div id="root"></div>
  </body>
</html>
