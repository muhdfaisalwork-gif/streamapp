<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ShadowStream — Offline</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0d0d0d;
        color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .wrap { text-align: center; padding: 24px; max-width: 420px; }
      .mark { font-size: 40px; margin-bottom: 12px; }
      h1 { font-size: 20px; margin: 0 0 8px; font-weight: 700; }
      p { font-size: 14px; line-height: 1.5; color: #9a9aa5; margin: 0 0 20px; }
      button {
        background: #e50914;
        color: #fff;
        border: 0;
        border-radius: 6px;
        padding: 11px 22px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #b00710; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark">🎬</div>
      <h1>You're offline</h1>
      <p>ShadowStream needs a connection the first time you load a page. Anything you already opened stays available offline.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
